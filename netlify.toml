# Netlify configuration for JohorUP System
[build]
  command = "cd johorup-system && npm run build"
  functions = "johorup-system/netlify/functions"
  publish = "johorup-system/out"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# API routes to Netlify functions (HIGHEST PRIORITY)
[[redirects]]
  from = "/api/test-simple"
  to = "/.netlify/functions/test-simple"
  status = 200

[[redirects]]
  from = "/api/test-db"
  to = "/.netlify/functions/api-test-db"
  status = 200

[[redirects]]
  from = "/api/init-database"
  to = "/.netlify/functions/init-database"
  status = 200

[[redirects]]
  from = "/api/debug-env"
  to = "/.netlify/functions/debug-env"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-:splat"
  status = 200

# Static files
[[redirects]]
  from = "/*.html"
  to = "/:splat.html"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

[[redirects]]
  from = "/*.css"
  to = "/:splat.css"
  status = 200

# Next.js static assets
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200

# Specific page redirects for SPA
[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

# Root redirect
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
