# Netlify configuration for JohorUP System
[build]
  base = "johorup-system"
  command = "npm install --legacy-peer-deps && npm run build"
  functions = "netlify/functions"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# API routes to Netlify functions (HIGHEST PRIORITY)
[[redirects]]
  from = "/api/test-simple"
  to = "/.netlify/functions/test-simple"
  status = 200

[[redirects]]
  from = "/api/test-db"
  to = "/.netlify/functions/api-test-db"
  status = 200

[[redirects]]
  from = "/api/init-database"
  to = "/.netlify/functions/init-database"
  status = 200

[[redirects]]
  from = "/api/debug-env"
  to = "/.netlify/functions/debug-env"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/setup-hierarchy"
  to = "/.netlify/functions/setup-hierarchical-schema-v2"
  status = 200

[[redirects]]
  from = "/api/user-hierarchy"
  to = "/.netlify/functions/get-user-hierarchy"
  status = 200

[[redirects]]
  from = "/api/admin-users"
  to = "/.netlify/functions/admin-user-management"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-:splat"
  status = 200

# Static files
[[redirects]]
  from = "/*.html"
  to = "/:splat.html"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

[[redirects]]
  from = "/*.css"
  to = "/:splat.css"
  status = 200

# Next.js static assets
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200

# Specific page redirects for SPA
[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

# Root redirect
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
