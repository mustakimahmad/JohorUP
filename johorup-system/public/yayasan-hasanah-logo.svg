<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <!-- Background -->
  <rect width="600" height="300" fill="#1a1a1a"/>
  
  <!-- YAYASAN HASANAH text -->
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="normal" fill="#888888">YAYASAN</text>
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="36" font-weight="normal" fill="#888888">HASANAH</text>
  
  <!-- Tagline -->
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="14" fill="#666666">A foundation of Khazanah Nasional</text>
  
  <!-- Vertical divider -->
  <line x1="350" y1="30" x2="350" y2="200" stroke="#444444" stroke-width="2"/>
  
  <!-- Logo symbol on the right -->
  <g transform="translate(400, 50)">
    <!-- Circular design with leaves -->
    <circle cx="75" cy="75" r="70" fill="none" stroke="#22c55e" stroke-width="2"/>
    
    <!-- Leaf shapes -->
    <path d="M45 45 Q30 30 45 15 Q60 30 45 45" fill="none" stroke="#22c55e" stroke-width="2"/>
    <path d="M105 45 Q120 30 105 15 Q90 30 105 45" fill="none" stroke="#22c55e" stroke-width="2"/>
    <path d="M75 105 Q60 120 75 135 Q90 120 75 105" fill="none" stroke="#22c55e" stroke-width="2"/>
    
    <!-- Center dots -->
    <circle cx="45" cy="75" r="4" fill="#22c55e"/>
    <circle cx="105" cy="75" r="4" fill="#22c55e"/>
    <circle cx="75" cy="45" r="4" fill="#22c55e"/>
    
    <!-- Connecting lines -->
    <path d="M45 75 Q75 60 105 75" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M75 45 Q60 75 75 105" fill="none" stroke="#22c55e" stroke-width="1.5"/>
  </g>
  
  <!-- Anniversary text -->
  <text x="420" y="180" font-family="Arial, sans-serif" font-size="10" fill="#22c55e">Ten Years: One Constellation, Infinite Impact</text>
</svg>