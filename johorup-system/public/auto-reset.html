<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JohorUP - Auto Reset</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
        .success { background: rgba(34, 197, 94, 0.3); }
        .info { background: rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 JohorUP System Reset</h1>
        <div class="spinner"></div>
        <div id="status">Memulakan pembersihan data...</div>
        
        <div class="status info">
            <strong>📋 Login Info Selepas Reset:</strong><br>
            📧 admin@jpnj.gov.my<br>
            🔑 AdminPass123!<br>
            👤 Role: admin (sahaja)
        </div>
    </div>

    <script>
        let step = 0;
        const steps = [
            'Membersihkan localStorage...',
            'Membersihkan sessionStorage...',
            'Membersihkan cache data...',
            'Membuang data user lama...',
            'Reset selesai! Mengalihkan ke login...'
        ];
        
        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (step < steps.length) {
                statusEl.textContent = steps[step];
                step++;
                setTimeout(updateStatus, 800);
            } else {
                // Clear all data
                localStorage.clear();
                sessionStorage.clear();
                
                // Clear specific items
                localStorage.removeItem('user');
                localStorage.removeItem('maintenanceMode');
                localStorage.removeItem('dashboardStats');
                
                // Clear IndexedDB if exists
                if ('indexedDB' in window) {
                    indexedDB.databases().then(databases => {
                        databases.forEach(db => {
                            if (db.name) indexedDB.deleteDatabase(db.name);
                        });
                    });
                }
                
                // Clear service worker cache if exists
                if ('caches' in window) {
                    caches.keys().then(names => {
                        names.forEach(name => {
                            caches.delete(name);
                        });
                    });
                }
                
                statusEl.innerHTML = '<div class="status success">✅ Reset selesai! Mengalihkan ke dashboard...</div>';
                
                // Redirect to main app
                setTimeout(() => {
                    window.location.href = '/';
                }, 2000);
            }
        }
        
        // Start the process
        setTimeout(updateStatus, 1000);
    </script>
</body>
</html>
