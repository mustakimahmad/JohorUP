[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# API routes to Netlify functions (highest priority)
[[redirects]]
  from = "/api/test-db"
  to = "/.netlify/functions/api-test-db"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-:splat"
  status = 200
  force = true

# Static files should not be redirected
[[redirects]]
  from = "/*.html"
  to = "/:splat.html"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

[[redirects]]
  from = "/*.css"
  to = "/:splat.css"
  status = 200

# Next.js pages and assets
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200

# SPA redirect for client-side routing (lowest priority)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
