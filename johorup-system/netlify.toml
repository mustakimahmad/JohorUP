[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Force function rebuild
[functions]
  node_bundler = "esbuild"
  
# Clear cache
[build.processing]
  skip_processing = false