[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Netlify Functions - HIGHEST PRIORITY
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

# API routes to Netlify functions
[[redirects]]
  from = "/api/test-simple"
  to = "/.netlify/functions/test-simple"
  status = 200

[[redirects]]
  from = "/api/test-db"
  to = "/.netlify/functions/api-test-db"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-:splat"
  status = 200

# Static files
[[redirects]]
  from = "/*.html"
  to = "/:splat.html"
  status = 200

[[redirects]]
  from = "/*.js"
  to = "/:splat.js"
  status = 200

[[redirects]]
  from = "/*.css"
  to = "/:splat.css"
  status = 200

# Next.js static assets
[[redirects]]
  from = "/_next/*"
  to = "/_next/:splat"
  status = 200

# Specific page redirects for SPA
[[redirects]]
  from = "/dashboard/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

# Root redirect
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
