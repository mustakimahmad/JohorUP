[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# API routes to Netlify functions
[[redirects]]
  from = "/api/test-db"
  to = "/.netlify/functions/api-test-db"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-:splat"
  status = 200

# Direct function access
[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA redirect for client-side routing (lowest priority)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
